<main class="login-shell" [attr.data-render]="state.renderVersion()" [attr.data-lang]="i18n.lang()">
  <section class="login-panel">
    <div class="brand-row">
      <span class="brand-mark">HR</span>
      <div>
        <h1>{{ 'app.name' | t }}</h1>
        <p>{{ 'app.tagline' | t }}</p>
      </div>
    </div>

    <form class="login-form" (ngSubmit)="state.login($event)">
      <label>
        <span>{{ 'auth.email' | t }}</span>
        <input name="email" type="email" [(ngModel)]="state.loginEmail" autocomplete="username" required>
      </label>
      <label>
        <span>{{ 'auth.password' | t }}</span>
        <div class="password-field">
          <input
            name="password"
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="state.loginPassword"
            autocomplete="current-password"
            required>
          <button
            type="button"
            class="password-toggle"
            (click)="showPassword = !showPassword"
            [attr.aria-label]="(showPassword ? 'auth.hidePassword' : 'auth.showPassword') | t"
            [attr.aria-pressed]="showPassword"
            [attr.title]="(showPassword ? 'auth.hidePassword' : 'auth.showPassword') | t">
            <svg *ngIf="!showPassword" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M12 5C7 5 2.7 8.1 1 12c1.7 3.9 6 7 11 7s9.3-3.1 11-7c-1.7-3.9-6-7-11-7zm0 11.5A4.5 4.5 0 1 1 12 7a4.5 4.5 0 0 1 0 9.5zm0-2.5a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/>
            </svg>
            <svg *ngIf="showPassword" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M3.3 2.3 2 3.6l3.1 3.1C3.3 8 1.8 9.8 1 12c1.7 3.9 6 7 11 7 2.1 0 4.1-.5 5.8-1.4l3.2 3.2 1.3-1.3L3.3 2.3zM12 17c-3.8 0-7.1-2.2-8.7-5 1-1.8 2.6-3.2 4.6-4l1.7 1.7A4.5 4.5 0 0 0 12 16.5V17zm2.9-3.6-1.5-1.5c.1-.3.1-.6.1-.9a2 2 0 0 0-2-2c-.3 0-.6 0-.9.1L9.1 7.6A4.5 4.5 0 0 1 16.5 12c0 .5-.1 1-.3 1.4zM12 7a4.4 4.4 0 0 1 .9.1l1.6-1.6A10.7 10.7 0 0 0 12 5C7 5 2.7 8.1 1 12c.4.9 1 1.8 1.7 2.6L5 12.3C6.4 9.2 9 7 12 7zm10.3 1.7-2.1 2.1c.5.7.9 1.4 1.1 2.2-1.6 2.8-4.9 5-8.7 5-.7 0-1.3-.1-2-.2l-1.6 1.6c1.1.4 2.3.6 3.6.6 5 0 9.3-3.1 11-7-.5-1.1-1.2-2.2-2.1-3.1z"/>
            </svg>
          </button>
        </div>
      </label>
      <div class="auth-row">
        <a class="auth-link" routerLink="/forgot-password">{{ 'auth.forgot' | t }}</a>
      </div>
      <button type="submit" class="primary-button" [disabled]="state.loginInProgress">
        {{ state.loginInProgress ? ('action.signingIn' | t) : ('action.signIn' | t) }}
      </button>
      <p class="error-text" aria-live="polite">{{ state.loginError }}</p>
    </form>

    <div class="demo-users" *ngIf="state.isDev">
      <button type="button" (click)="state.setDemoUser('admin@hr.local', 'Admin@123')">{{ 'auth.demoAdmin' | t }}</button>
      <button type="button" (click)="state.setDemoUser('manager@hr.local', 'Manager@123')">{{ 'auth.demoManager' | t }}</button>
      <button type="button" (click)="state.setDemoUser('employee@hr.local', 'Employee@123')">{{ 'auth.demoEmployee' | t }}</button>
    </div>
  </section>
</main>
