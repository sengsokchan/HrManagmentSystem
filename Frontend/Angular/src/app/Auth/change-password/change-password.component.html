<main class="login-shell" [attr.data-render]="state.renderVersion()" [attr.data-lang]="i18n.lang()">
  <section class="login-panel">
    <div class="lang-switch login-lang" role="group" [attr.aria-label]="'lang.label' | t">
      <button type="button" class="ghost-button lang-btn" [class.active]="i18n.lang() === 'en'" (click)="i18n.setLang('en')">
        {{ 'lang.en' | t }}
      </button>
      <button type="button" class="ghost-button lang-btn" [class.active]="i18n.lang() === 'km'" (click)="i18n.setLang('km')">
        {{ 'lang.km' | t }}
      </button>
    </div>

    <div class="brand-row">
      <span class="brand-mark">HR</span>
      <div>
        <h1>{{ 'auth.changeTitle' | t }}</h1>
        <p>{{ 'auth.changeSub' | t }}</p>
      </div>
    </div>

    <form class="login-form" (ngSubmit)="state.submitChangePassword($event)">
      <label>
        <span>{{ 'auth.currentPassword' | t }}</span>
        <input
          name="currentPassword"
          type="password"
          [(ngModel)]="state.changeCurrentPassword"
          autocomplete="current-password"
          required>
      </label>
      <label>
        <span>{{ 'auth.newPassword' | t }}</span>
        <input
          name="newPassword"
          type="password"
          [(ngModel)]="state.changeNewPassword"
          autocomplete="new-password"
          required
          minlength="14">
      </label>
      <label>
        <span>{{ 'auth.confirmPassword' | t }}</span>
        <input
          name="confirmPassword"
          type="password"
          [(ngModel)]="state.changeConfirmPassword"
          autocomplete="new-password"
          required
          minlength="14">
      </label>

      <ul class="password-tips">
        <li>{{ 'auth.tipLength' | t }}</li>
        <li>{{ 'auth.tipPhrase' | t }}</li>
        <li>{{ 'auth.tipUnique' | t }}</li>
      </ul>

      <button type="submit" class="primary-button" [disabled]="state.changePasswordInProgress">
        {{ state.changePasswordInProgress ? ('auth.saving' | t) : ('auth.savePassphrase' | t) }}
      </button>
      <p class="error-text" aria-live="polite">{{ state.changePasswordError }}</p>
    </form>

    <button type="button" class="ghost-button full-width" (click)="state.logout()">{{ 'nav.signOut' | t }}</button>
  </section>
</main>
